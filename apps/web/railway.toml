"$schema" = "https://railway.com/railway.schema.json"

[build]
builder = "RAILPACK"
buildCommand = "bun install --frozen-lockfile && bun run --cwd apps/web build"

[deploy]
startCommand = "bun run --cwd apps/web start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
